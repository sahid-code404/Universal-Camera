name: Android CI

on:
  push:
    branches: [main, phase-0-1-foundation]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :camera-capability:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
